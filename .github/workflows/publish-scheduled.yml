name: Publish scheduled posts

on:
  schedule:
    # Hourly, on the hour (UTC). GitHub's cron can run late — treat the
    # publish time as approximate, not exact.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish posts that are due
        run: node scripts/publish-scheduled.mjs

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No posts were due; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish scheduled post(s)"
          git push
