name: Update profile README blog posts

# Rewrites the "Recent Writing" list in the GitHub profile README
# (theunwindfront/theunwindfront) with the latest published posts.
#
# Needs a repo secret PROFILE_README_TOKEN: a fine-grained personal access
# token with "Contents: Read and write" on theunwindfront/theunwindfront only.

on:
  schedule:
    - cron: '15 5 * * *' # daily, after scheduled posts have been published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ github.repository_owner }}
          token: ${{ secrets.PROFILE_README_TOKEN }}
          path: profile

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node scripts/update-profile-readme.mjs profile/README.md

      - name: Commit and push
        working-directory: profile
        run: |
          if git diff --quiet README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update latest blog posts"
          git push
