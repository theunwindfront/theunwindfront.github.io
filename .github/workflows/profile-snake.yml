name: Generate contribution snake

# Builds the contribution-snake SVGs shown on the GitHub profile README
# (theunwindfront/theunwindfront) and publishes them to this repo's `output`
# branch. GitHub Pages deploys from `main`, so `output` never touches the site.

on:
  schedule:
    - cron: '0 0 * * *' # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
