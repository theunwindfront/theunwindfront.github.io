  <rect x="494" y="276" width="336" height="172" rx="12" fill="#f28b9b" fill-opacity=".13" stroke="#f28b9b"/>
  <!-- labels -->
  <text x="166" y="118" font-size="15" font-weight="700" fill="#6fd3b0">HAND IT OVER</text>
  <text x="514" y="118" font-size="15" font-weight="700" fill="#b3b3f7">HAND OVER + CHECK</text>
  <text x="166" y="306" font-size="15" font-weight="700" fill="#f2b880">USE AS A DRAFT</text>
  <text x="514" y="306" font-size="15" font-weight="700" fill="#f28b9b">HUMAN-LED</text>
  <g font-size="13" fill="#ece9e2">
