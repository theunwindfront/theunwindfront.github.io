  <line x1="130" y1="460" x2="130" y2="80" stroke="#a19e97" stroke-width="2"/>
  <path d="M123 80 l7 -12 l7 12 z" fill="#a19e97"/>
  <text x="485" y="494" text-anchor="middle" font-size="13" fill="#a19e97">cost of an unnoticed mistake →</text>
  <text x="96" y="270" text-anchor="middle" font-size="13" fill="#a19e97" transform="rotate(-90 96 270)">easy to verify →</text>
  <!-- quadrants -->
  <rect x="146" y="88" width="336" height="176" rx="12" fill="#6fd3b0" fill-opacity=".14" stroke="#6fd3b0"/>
