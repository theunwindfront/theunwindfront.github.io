    <rect x="166" y="176" width="200" height="30" rx="8" fill="#23232a"/><text x="266" y="196" text-anchor="middle">mechanical refactor</text>
    <rect x="166" y="216" width="160" height="30" rx="8" fill="#23232a"/><text x="246" y="236" text-anchor="middle">config lookups</text>

    <rect x="514" y="136" width="96" height="30" rx="8" fill="#23232a"/><text x="562" y="156" text-anchor="middle">tests</text>
    <rect x="620" y="136" width="190" height="30" rx="8" fill="#23232a"/><text x="715" y="156" text-anchor="middle">explain old code</text>
    <rect x="514" y="176" width="210" height="30" rx="8" fill="#23232a"/><text x="619" y="196" text-anchor="middle">dependency upgrade</text>

    <rect x="166" y="324" width="170" height="30" rx="8" fill="#23232a"/><text x="251" y="344" text-anchor="middle">component draft</text>
    <rect x="346" y="324" width="116" height="30" rx="8" fill="#23232a"/><text x="404" y="344" text-anchor="middle">docs · copy</text>
    <rect x="166" y="364" width="150" height="30" rx="8" fill="#23232a"/><text x="241" y="384" text-anchor="middle">PR summary</text>

    <rect x="514" y="324" width="150" height="30" rx="8" fill="#23232a"/><text x="589" y="344" text-anchor="middle">accessibility</text>
    <rect x="674" y="324" width="136" height="30" rx="8" fill="#23232a"/><text x="742" y="344" text-anchor="middle">visual polish</text>
    <rect x="514" y="364" width="150" height="30" rx="8" fill="#23232a"/><text x="589" y="384" text-anchor="middle">architecture</text>
    <rect x="674" y="364" width="136" height="30" rx="8" fill="#23232a"/><text x="742" y="384" text-anchor="middle">design system</text>
