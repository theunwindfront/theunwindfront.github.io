<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="440" rx="16" fill="#16161b"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8f8fef"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8f8d88"/></marker>
  </defs>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">EVERY STATE GETS ITS OWN UI</text>

  <!-- happy path -->
  <rect x="40" y="90" width="140" height="64" rx="12" fill="#23232a" stroke="#2e2e36"/>
  <text x="110" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ece9e2">idle</text>
  <text x="110" y="138" text-anchor="middle" font-size="12" fill="#a19e97">input ready</text>

  <rect x="230" y="90" width="150" height="64" rx="12" fill="#23232a" stroke="#8f8fef"/>
  <text x="305" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#b3b3f7">thinking</text>
  <text x="305" y="138" text-anchor="middle" font-size="12" fill="#a19e97">real status text</text>

  <rect x="430" y="90" width="150" height="64" rx="12" fill="#23232a" stroke="#8f8fef"/>
  <text x="505" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#b3b3f7">streaming</text>
  <text x="505" y="138" text-anchor="middle" font-size="12" fill="#a19e97">aria-busy, Stop</text>

  <rect x="630" y="90" width="210" height="64" rx="12" fill="#1f2b27" stroke="#6fd3b0"/>
  <text x="735" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#6fd3b0">review</text>
  <text x="735" y="138" text-anchor="middle" font-size="12" fill="#a19e97">editable draft</text>

  <path d="M181 122 h46" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>
  <text x="204" y="112" text-anchor="middle" font-size="12" fill="#8f8d88">ask</text>
  <path d="M381 122 h46" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M581 122 h46" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>

  <!-- review outcomes -->
  <rect x="630" y="186" width="64" height="32" rx="8" fill="#5b5bd6"/>
  <text x="662" y="207" text-anchor="middle" font-size="12" fill="#fff">accept</text>
  <rect x="703" y="186" width="64" height="32" rx="8" fill="#23232a" stroke="#2e2e36"/>
  <text x="735" y="207" text-anchor="middle" font-size="12" fill="#ece9e2">edit</text>
  <rect x="776" y="186" width="64" height="32" rx="8" fill="#23232a" stroke="#2e2e36"/>
  <text x="808" y="207" text-anchor="middle" font-size="12" fill="#a19e97">discard</text>
  <path d="M735 156 v27" stroke="#6fd3b0" stroke-width="2"/>
  <text x="735" y="242" text-anchor="middle" font-size="12" fill="#8f8d88">+ undo</text>

  <!-- unhappy states -->
  <rect x="230" y="270" width="150" height="72" rx="12" fill="#2a1c20" stroke="#f28b9b"/>
  <text x="305" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#f28b9b">stopped</text>
  <text x="305" y="320" text-anchor="middle" font-size="12" fill="#a19e97">keep partial text</text>

  <rect x="430" y="270" width="150" height="72" rx="12" fill="#2a1c20" stroke="#f28b9b"/>
  <text x="505" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#f28b9b">failed</text>
  <text x="505" y="320" text-anchor="middle" font-size="12" fill="#a19e97">keep user input</text>

  <rect x="630" y="270" width="150" height="72" rx="12" fill="#2b2620" stroke="#f2b880"/>
  <text x="705" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#f2b880">empty</text>
  <text x="705" y="320" text-anchor="middle" font-size="12" fill="#a19e97">say so, suggest</text>

  <!-- edges to unhappy -->
  <path d="M305 156 v111" stroke="#8f8d88" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <path d="M480 156 L330 267" stroke="#8f8d88" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <path d="M505 156 v111" stroke="#8f8d88" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <path d="M560 156 L680 267" stroke="#8f8d88" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <text x="318" y="222" font-size="12" fill="#8f8d88">stop</text>
  <text x="514" y="242" font-size="12" fill="#8f8d88">error</text>
  <text x="600" y="205" text-anchor="end" font-size="12" fill="#8f8d88">nothing</text>

  <!-- retry loop back to idle -->
  <path d="M705 344 v36 H110 V157" fill="none" stroke="#8f8fef" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <path d="M305 344 v36 M505 344 v36" stroke="#8f8fef" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="120" y="408" font-size="12" fill="#8f8fef">retry or edit the prompt: back to idle with the input intact</text>
</svg>
