<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="450" rx="16" fill="#16161b"/>
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8fef"/>
    </marker>
  </defs>
  <text x="40" y="48" font-size="15" fill="#8f8d88" letter-spacing="2">ACF FLEXIBLE CONTENT → BLADE COMPONENTS</text>

  <!-- column headers -->
  <text x="140" y="86" text-anchor="middle" font-size="12" fill="#a19e97" letter-spacing="1">ACF LAYOUTS</text>
  <text x="420" y="86" text-anchor="middle" font-size="12" fill="#a19e97" letter-spacing="1">PAGE TEMPLATE LOOP</text>
  <text x="720" y="86" text-anchor="middle" font-size="12" fill="#a19e97" letter-spacing="1">SECTION COMPONENTS</text>

  <!-- ACF layouts -->
  <rect x="40" y="102" width="200" height="50" rx="10" fill="#1b1b20" stroke="#f2b880"/>
  <text x="140" y="132" text-anchor="middle" font-size="13" fill="#f2b880">hero_banner</text>
  <rect x="40" y="172" width="200" height="50" rx="10" fill="#1b1b20" stroke="#f2b880"/>
  <text x="140" y="202" text-anchor="middle" font-size="13" fill="#f2b880">card_grid</text>
  <rect x="40" y="242" width="200" height="50" rx="10" fill="#1b1b20" stroke="#f2b880"/>
  <text x="140" y="272" text-anchor="middle" font-size="13" fill="#f2b880">cta</text>

  <!-- arrows in -->
  <line x1="244" y1="127" x2="294" y2="160" stroke="#8f8fef" stroke-width="2" marker-end="url(#ca)"/>
  <line x1="244" y1="197" x2="294" y2="197" stroke="#8f8fef" stroke-width="2" marker-end="url(#ca)"/>
  <line x1="244" y1="267" x2="294" y2="234" stroke="#8f8fef" stroke-width="2" marker-end="url(#ca)"/>

  <!-- loop box -->
  <rect x="300" y="102" width="240" height="190" rx="12" fill="#5b5bd6"/>
  <text x="420" y="136" text-anchor="middle" font-size="13" fill="#e4e4fb">@foreach sections</text>
  <text x="420" y="168" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">acf_fc_layout</text>
  <text x="420" y="190" text-anchor="middle" font-size="12" fill="#e4e4fb">"_" → "-"</text>
  <rect x="318" y="210" width="204" height="30" rx="8" fill="#16161b" opacity=".35"/>
  <text x="420" y="230" text-anchor="middle" font-size="12" fill="#fff">x-dynamic-component</text>
  <text x="420" y="268" text-anchor="middle" font-size="12" fill="#e4e4fb">skip if view missing</text>

  <!-- arrows out -->
  <line x1="544" y1="160" x2="594" y2="127" stroke="#8f8fef" stroke-width="2" marker-end="url(#ca)"/>
  <line x1="544" y1="197" x2="594" y2="197" stroke="#8f8fef" stroke-width="2" marker-end="url(#ca)"/>
  <line x1="544" y1="234" x2="594" y2="267" stroke="#8f8fef" stroke-width="2" marker-end="url(#ca)"/>

  <!-- section components -->
  <rect x="600" y="102" width="240" height="50" rx="10" fill="#1b1b20" stroke="#8f8fef"/>
  <text x="720" y="132" text-anchor="middle" font-size="13" fill="#ece9e2">sections/hero-banner</text>
  <rect x="600" y="172" width="240" height="50" rx="10" fill="#1b1b20" stroke="#8f8fef"/>
  <text x="720" y="202" text-anchor="middle" font-size="13" fill="#ece9e2">sections/card-grid</text>
  <rect x="600" y="242" width="240" height="50" rx="10" fill="#1b1b20" stroke="#8f8fef"/>
  <text x="720" y="272" text-anchor="middle" font-size="13" fill="#ece9e2">sections/cta</text>

  <!-- uses -->
  <line x1="720" y1="296" x2="720" y2="336" stroke="#6fd3b0" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="732" y="322" font-size="12" fill="#6fd3b0">built from</text>

  <!-- shared UI band -->
  <rect x="40" y="340" width="800" height="76" rx="12" fill="#1b1b20" stroke="#6fd3b0" stroke-width="1.5"/>
  <text x="62" y="384" font-size="12" fill="#6fd3b0" letter-spacing="1">UI + LAYOUT</text>
  <rect x="180" y="360" width="130" height="36" rx="8" fill="#23232a" stroke="#2e2e36"/>
  <text x="245" y="383" text-anchor="middle" font-size="13" fill="#ece9e2">ui.button</text>
  <rect x="324" y="360" width="130" height="36" rx="8" fill="#23232a" stroke="#2e2e36"/>
  <text x="389" y="383" text-anchor="middle" font-size="13" fill="#ece9e2">ui.card</text>
  <rect x="468" y="360" width="130" height="36" rx="8" fill="#23232a" stroke="#2e2e36"/>
  <text x="533" y="383" text-anchor="middle" font-size="13" fill="#ece9e2">ui.badge</text>
  <rect x="612" y="360" width="210" height="36" rx="8" fill="#23232a" stroke="#2e2e36"/>
  <text x="717" y="383" text-anchor="middle" font-size="13" fill="#ece9e2">layout.section</text>

  <text x="440" y="438" text-anchor="middle" font-size="12" fill="#8f8d88">ACF knowledge stays in sections/ · UI components take plain props</text>
</svg>
