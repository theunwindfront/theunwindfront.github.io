<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="420" rx="16" fill="#16161b"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8f8fef"/></marker>
  </defs>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">ONE RELEASE, END TO END</text>

  <!-- stage 1 -->
  <rect x="40" y="80" width="146" height="170" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="56" y="106" font-size="12" fill="#8f8fef">1. TAG</text>
  <rect x="56" y="122" width="114" height="32" rx="8" fill="#5b5bd6"/>
  <text x="113" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">v1.4.0</text>
  <text x="113" y="186" text-anchor="middle" font-size="12" fill="#a19e97">version from</text>
  <text x="113" y="204" text-anchor="middle" font-size="12" fill="#a19e97">the git tag</text>

  <!-- stage 2 -->
  <rect x="204" y="80" width="146" height="170" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="220" y="106" font-size="12" fill="#8f8fef">2. BUILD</text>
  <rect x="220" y="120" width="114" height="30" rx="7" fill="#23232a"/>
  <text x="277" y="140" text-anchor="middle" font-size="12" fill="#ece9e2">macos runner</text>
  <rect x="220" y="156" width="114" height="30" rx="7" fill="#23232a"/>
  <text x="277" y="176" text-anchor="middle" font-size="12" fill="#ece9e2">windows runner</text>
  <rect x="220" y="192" width="114" height="30" rx="7" fill="#23232a"/>
  <text x="277" y="212" text-anchor="middle" font-size="12" fill="#ece9e2">ubuntu runner</text>

  <!-- stage 3 -->
  <rect x="368" y="80" width="146" height="170" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="384" y="106" font-size="12" fill="#8f8fef">3. SIGN</text>
  <rect x="384" y="120" width="114" height="30" rx="7" fill="#1f2b27" stroke="#6fd3b0"/>
  <text x="441" y="140" text-anchor="middle" font-size="12" fill="#6fd3b0">notarize</text>
  <rect x="384" y="156" width="114" height="30" rx="7" fill="#1f2b27" stroke="#6fd3b0"/>
  <text x="441" y="176" text-anchor="middle" font-size="12" fill="#6fd3b0">code-sign</text>
  <rect x="384" y="192" width="114" height="30" rx="7" fill="#2b2620" stroke="#f2b880"/>
  <text x="441" y="212" text-anchor="middle" font-size="12" fill="#f2b880">checksums</text>

  <!-- stage 4 -->
  <rect x="532" y="80" width="146" height="170" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="548" y="106" font-size="12" fill="#8f8fef">4. PUBLISH</text>
  <text x="605" y="140" text-anchor="middle" font-size="12" fill="#ece9e2">native:publish</text>
  <text x="605" y="166" text-anchor="middle" font-size="12" fill="#a19e97">uploads to the</text>
  <text x="605" y="184" text-anchor="middle" font-size="12" fill="#a19e97">update provider</text>
  <rect x="548" y="200" width="114" height="30" rx="7" fill="#23232a"/>
  <text x="605" y="220" text-anchor="middle" font-size="12" fill="#b3b3f7">GitHub · S3</text>

  <!-- stage 5 -->
  <rect x="696" y="80" width="146" height="170" rx="12" fill="#1b1b20" stroke="#5b5bd6"/>
  <text x="712" y="106" font-size="12" fill="#8f8fef">5. UPDATE</text>
  <text x="769" y="140" text-anchor="middle" font-size="12" fill="#ece9e2">installed app</text>
  <text x="769" y="166" text-anchor="middle" font-size="12" fill="#a19e97">check</text>
  <text x="769" y="186" text-anchor="middle" font-size="12" fill="#a19e97">download</text>
  <text x="769" y="206" text-anchor="middle" font-size="12" fill="#a19e97">restart</text>
  <text x="769" y="228" text-anchor="middle" font-size="12" fill="#6fd3b0">→ 1.4.0</text>

  <!-- arrows between stages -->
  <path d="M187 165 h14" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M351 165 h14" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M515 165 h14" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M679 165 h14" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>

  <!-- polling loop -->
  <path d="M769 252 v36 h-164 v-32" fill="none" stroke="#8f8fef" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/>
  <text x="687" y="310" text-anchor="middle" font-size="12" fill="#8f8fef">apps poll the provider</text>

  <!-- notes -->
  <line x1="40" y1="336" x2="840" y2="336" stroke="#2e2e36"/>
  <text x="40" y="364" font-size="12" fill="#a19e97">Each OS builds on its own runner. macOS needs a Developer ID cert + notarization,</text>
  <text x="40" y="384" font-size="12" fill="#a19e97">Windows a trusted code signing cert. Auto-updates on macOS only work when signed.</text>
</svg>
