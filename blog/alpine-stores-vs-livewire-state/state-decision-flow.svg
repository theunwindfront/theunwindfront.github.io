<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="560" rx="16" fill="#16161b"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a19e97"/></marker></defs>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">WHERE SHOULD THIS STATE LIVE?</text>
  <!-- start -->
  <rect x="40" y="72" width="200" height="44" rx="22" fill="#23232a" stroke="#2e2e36"/>
  <text x="140" y="99" text-anchor="middle" font-size="14" fill="#ece9e2" font-weight="700">New piece of state</text>
  <line x1="140" y1="118" x2="140" y2="144" stroke="#a19e97" stroke-width="2" marker-end="url(#a)"/>
  <!-- Q1 -->
  <rect x="70" y="148" width="370" height="56" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="90" y="173" font-size="14" fill="#ece9e2">Does PHP need to read it?</text>
  <text x="90" y="193" font-size="12" fill="#a19e97">query · validate · save · authorise</text>
  <line x1="442" y1="176" x2="596" y2="176" stroke="#a19e97" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="168" font-size="12" fill="#6fd3b0">yes</text>
  <rect x="600" y="148" width="240" height="56" rx="10" fill="#2a1c20" stroke="#f28b9b"/>
  <text x="720" y="173" text-anchor="middle" font-size="14" fill="#f28b9b" font-weight="700">Livewire property</text>
  <text x="720" y="193" text-anchor="middle" font-size="12" fill="#a19e97">server state</text>
  <line x1="140" y1="206" x2="140" y2="238" stroke="#a19e97" stroke-width="2" marker-end="url(#a)"/>
  <text x="152" y="228" font-size="12" fill="#a19e97">no</text>
  <!-- Q2 from livewire -->
  <path d="M720 206 v34" fill="none" stroke="#a19e97" stroke-width="2" marker-end="url(#a)"/>
  <rect x="600" y="244" width="240" height="56" rx="10" fill="#2e261e" stroke="#f2b880"/>
  <text x="720" y="269" text-anchor="middle" font-size="14" fill="#f2b880" font-weight="700">+ #[Url]</text>
  <text x="732" y="228" font-size="12" fill="#a19e97">shareable?</text>
  <text x="720" y="289" text-anchor="middle" font-size="12" fill="#a19e97">links · back button</text>
  <!-- Q3 -->
  <rect x="70" y="242" width="370" height="56" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="90" y="267" font-size="14" fill="#ece9e2">Needed by more than one</text>
  <text x="90" y="287" font-size="14" fill="#ece9e2">component?</text>
  <line x1="140" y1="300" x2="140" y2="332" stroke="#a19e97" stroke-width="2" marker-end="url(#a)"/>
  <text x="152" y="322" font-size="12" fill="#a19e97">yes</text>
    <path d="M70 280 H 40 V 450 H 66" fill="none" stroke="#a19e97" stroke-width="2" marker-end="url(#a)"/>
  <text x="48" y="412" font-size="12" fill="#a19e97">no</text>
  <!-- store -->
  <rect x="70" y="336" width="370" height="56" rx="10" fill="#2a2440" stroke="#8f8fef"/>
  <text x="255" y="361" text-anchor="middle" font-size="14" fill="#b3b3f7" font-weight="700">Alpine.store</text>
  <text x="255" y="381" text-anchor="middle" font-size="12" fill="#a19e97">shared UI · server talks via dispatch()</text>
  <!-- persist -->
  <path d="M442 364 H 596" fill="none" stroke="#a19e97" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="519" y="356" text-anchor="middle" font-size="12" fill="#a19e97">survive reload?</text>
  <rect x="600" y="336" width="240" height="56" rx="10" fill="#1b1b20" stroke="#8f8fef"/>
  <text x="720" y="361" text-anchor="middle" font-size="14" fill="#b3b3f7" font-weight="700">+ $persist</text>
  <text x="720" y="381" text-anchor="middle" font-size="12" fill="#a19e97">with an explicit .as() key</text>
  <!-- local x-data -->
  <rect x="70" y="422" width="370" height="56" rx="10" fill="#1f2e2a" stroke="#6fd3b0"/>
  <text x="255" y="447" text-anchor="middle" font-size="14" fill="#6fd3b0" font-weight="700">Local x-data</text>
  <text x="255" y="467" text-anchor="middle" font-size="12" fill="#a19e97">dropdowns, tabs, toggles · most common</text>
  <path d="M600 450 H 444" fill="none" stroke="#a19e97" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="600" y="422" width="240" height="56" rx="10" fill="#1b1b20" stroke="#6fd3b0"/>
  <text x="720" y="447" text-anchor="middle" font-size="14" fill="#6fd3b0" font-weight="700">+ $persist</text>
  <text x="720" y="467" text-anchor="middle" font-size="12" fill="#a19e97">if it should survive reload</text>
  <!-- footer -->
  <text x="440" y="522" text-anchor="middle" font-size="13" fill="#ece9e2">Both sides must write it? $wire first, entangle last.</text>
</svg>
