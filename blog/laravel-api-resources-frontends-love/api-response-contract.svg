<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="460" rx="16" fill="#16161b"/>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">FROM REQUEST TO CONTRACT</text>
  <!-- pipeline -->
  <g font-size="12">
    <rect x="40" y="80" width="180" height="96" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="56" y="106" font-size="14" fill="#ece9e2" font-weight="700">Request</text>
    <text x="56" y="130" fill="#a19e97">?include=author</text>
    <text x="56" y="148" fill="#a19e97">&amp;per_page=20</text>
    <text x="56" y="166" fill="#a19e97">&amp;fields[posts]=…</text>
    <rect x="250" y="80" width="180" height="96" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="266" y="106" font-size="14" fill="#ece9e2" font-weight="700">Controller</text>
    <text x="266" y="130" fill="#a19e97">allow-list includes</text>
    <text x="266" y="148" fill="#a19e97">with() / withCount()</text>
    <text x="266" y="166" fill="#a19e97">cap per_page</text>
    <rect x="460" y="80" width="180" height="96" rx="12" fill="#1b1b20" stroke="#8f8fef"/>
    <text x="476" y="106" font-size="14" fill="#b3b3f7" font-weight="700">API Resource</text>
    <text x="476" y="130" fill="#a19e97">explicit fields</text>
    <text x="476" y="148" fill="#a19e97">whenLoaded()</text>
    <text x="476" y="166" fill="#a19e97">ISO dates, enums</text>
    <rect x="670" y="80" width="170" height="96" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="686" y="106" font-size="14" fill="#ece9e2" font-weight="700">Frontend</text>
    <text x="686" y="130" fill="#a19e97">one fetch helper</text>
    <text x="686" y="148" fill="#a19e97">generated types</text>
    <text x="686" y="166" fill="#a19e97">no special cases</text>
  </g>
  <g stroke="#8f8fef" stroke-width="2" fill="none">
    <path d="M222 128 h24"/><path d="M240 122 l7 6 l-7 6"/>
    <path d="M432 128 h24"/><path d="M450 122 l7 6 l-7 6"/>
    <path d="M642 128 h24"/><path d="M660 122 l7 6 l-7 6"/>
  </g>
  <!-- success envelope -->
  <rect x="40" y="206" width="480" height="220" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="60" y="234" font-size="14" fill="#6fd3b0" font-weight="700">200 · paginated collection</text>
  <g font-size="13">
    <rect x="60" y="250" width="140" height="156" rx="10" fill="#23232a" stroke="#5b5bd6"/>
    <text x="76" y="276" fill="#b3b3f7">data</text>
    <text x="76" y="300" font-size="12" fill="#a19e97">[ Post, Post,</text>
    <text x="76" y="318" font-size="12" fill="#a19e97">  Post, … ]</text>
    <rect x="212" y="250" width="140" height="156" rx="10" fill="#23232a" stroke="#6fd3b0"/>
    <text x="228" y="276" fill="#6fd3b0">links</text>
    <text x="228" y="300" font-size="12" fill="#a19e97">first, last</text>
    <text x="228" y="318" font-size="12" fill="#a19e97">prev, next</text>
    <rect x="364" y="250" width="140" height="156" rx="10" fill="#23232a" stroke="#f2b880"/>
    <text x="380" y="276" fill="#f2b880">meta</text>
    <text x="380" y="300" font-size="12" fill="#a19e97">current_page</text>
    <text x="380" y="318" font-size="12" fill="#a19e97">last_page</text>
    <text x="380" y="336" font-size="12" fill="#a19e97">per_page</text>
    <text x="380" y="354" font-size="12" fill="#a19e97">total</text>
    <text x="380" y="372" font-size="12" fill="#a19e97">from, to</text>
  </g>
  <!-- error envelope -->
  <rect x="550" y="206" width="290" height="220" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="570" y="234" font-size="14" fill="#f28b9b" font-weight="700">4xx / 5xx · always JSON</text>
  <g font-size="13">
    <rect x="570" y="250" width="250" height="44" rx="10" fill="#23232a"/>
    <text x="586" y="277" fill="#ece9e2">message: "…"</text>
    <rect x="570" y="304" width="250" height="60" rx="10" fill="#2a1c20" stroke="#f28b9b"/>
    <text x="586" y="328" fill="#f28b9b">errors (422 only)</text>
    <text x="586" y="350" font-size="12" fill="#a19e97">field: [messages]</text>
    <text x="570" y="392" font-size="12" fill="#a19e97">401 sign in · 403 denied</text>
    <text x="570" y="412" font-size="12" fill="#a19e97">404 missing · 429 back off</text>
  </g>
</svg>
