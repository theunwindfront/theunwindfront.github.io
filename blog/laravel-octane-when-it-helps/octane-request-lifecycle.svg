<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="ui-monospace, Menlo, monospace">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8f8d88"/></marker>
  </defs>
  <rect width="880" height="420" rx="16" fill="#16161b"/>
  <text x="40" y="48" font-size="15" fill="#8f8d88" letter-spacing="2">SAME THREE REQUESTS, TWO MODELS</text>

  <!-- FPM lane -->
  <text x="40" y="108" font-size="15" fill="#ece9e2" font-weight="700">PHP-FPM</text>
  <text x="40" y="128" font-size="12" fill="#a19e97">boot every time</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="200" y="88" width="90" height="44" rx="8" fill="#f28b9b"/><text x="245" y="115" fill="#1a1a1a">boot</text>
    <rect x="294" y="88" width="70" height="44" rx="8" fill="#f2b880"/><text x="329" y="115" fill="#1a1a1a">handle</text>
    <rect x="368" y="88" width="24" height="44" rx="6" fill="#3a3a44"/>

    <rect x="402" y="88" width="90" height="44" rx="8" fill="#f28b9b"/><text x="447" y="115" fill="#1a1a1a">boot</text>
    <rect x="496" y="88" width="70" height="44" rx="8" fill="#f2b880"/><text x="531" y="115" fill="#1a1a1a">handle</text>
    <rect x="570" y="88" width="24" height="44" rx="6" fill="#3a3a44"/>

    <rect x="604" y="88" width="90" height="44" rx="8" fill="#f28b9b"/><text x="649" y="115" fill="#1a1a1a">boot</text>
    <rect x="698" y="88" width="70" height="44" rx="8" fill="#f2b880"/><text x="733" y="115" fill="#1a1a1a">handle</text>
    <rect x="772" y="88" width="24" height="44" rx="6" fill="#3a3a44"/>
  </g>
  <text x="820" y="115" font-size="12" fill="#a19e97" text-anchor="middle">…</text>

  <!-- Octane lane -->
  <text x="40" y="208" font-size="15" fill="#ece9e2" font-weight="700">Octane</text>
  <text x="40" y="228" font-size="12" fill="#a19e97">boot once per worker</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="200" y="188" width="90" height="44" rx="8" fill="#f28b9b"/><text x="245" y="215" fill="#1a1a1a">boot</text>
    <rect x="294" y="188" width="70" height="44" rx="8" fill="#f2b880"/><text x="329" y="215" fill="#1a1a1a">handle</text>
    <rect x="368" y="188" width="14" height="44" rx="5" fill="#6fd3b0"/>
    <rect x="386" y="188" width="70" height="44" rx="8" fill="#f2b880"/><text x="421" y="215" fill="#1a1a1a">handle</text>
    <rect x="460" y="188" width="14" height="44" rx="5" fill="#6fd3b0"/>
    <rect x="478" y="188" width="70" height="44" rx="8" fill="#f2b880"/><text x="513" y="215" fill="#1a1a1a">handle</text>
    <rect x="552" y="188" width="14" height="44" rx="5" fill="#6fd3b0"/>
  </g>
  <text x="600" y="210" font-size="13" fill="#6fd3b0" font-weight="700">done early,</text>
  <text x="600" y="228" font-size="13" fill="#6fd3b0" font-weight="700">ready for more</text>

  <!-- time axis -->
  <line x1="200" y1="262" x2="836" y2="262" stroke="#8f8d88" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="836" y="284" font-size="12" fill="#8f8d88" text-anchor="end">time</text>

  <!-- persistence bracket -->
  <path d="M294 244 v8 h272 v-8" fill="none" stroke="#b3b3f7" stroke-width="2" transform="translate(0,52)"/>
  <text x="430" y="326" font-size="12" fill="#b3b3f7" text-anchor="middle">singletons and static properties</text>
  <text x="430" y="344" font-size="12" fill="#b3b3f7" text-anchor="middle">live across all of these</text>

  <!-- legend -->
  <g font-size="12" fill="#a19e97">
    <rect x="40" y="370" width="14" height="14" rx="3" fill="#f28b9b"/><text x="62" y="382">framework bootstrap</text>
    <rect x="240" y="370" width="14" height="14" rx="3" fill="#f2b880"/><text x="262" y="382">your code (queries, APIs)</text>
    <rect x="490" y="370" width="14" height="14" rx="3" fill="#6fd3b0"/><text x="512" y="382">Octane reset</text>
    <rect x="650" y="370" width="14" height="14" rx="3" fill="#3a3a44"/><text x="672" y="382">teardown</text>
  </g>
</svg>
