<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="520" rx="16" fill="#16161b"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8f8d88"/></marker>
  </defs>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">WHERE THE HTML GETS RENDERED</text>

  <!-- column headers -->
  <text x="160" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#6fd3b0">Traditional</text>
  <text x="440" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#f2b880">Hybrid</text>
  <text x="720" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#f28b9b">Headless</text>

  <!-- browsers row -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="110" width="200" height="50" rx="10" fill="#23232a" stroke="#2e2e36"/>
    <text x="160" y="140" fill="#ece9e2">Browser</text>
    <rect x="340" y="110" width="200" height="50" rx="10" fill="#23232a" stroke="#2e2e36"/>
    <text x="440" y="132" fill="#ece9e2">Browser</text>
    <text x="440" y="150" fill="#f2b880" font-size="12">+ JS islands</text>
    <rect x="620" y="110" width="200" height="50" rx="10" fill="#23232a" stroke="#2e2e36"/>
    <text x="720" y="140" fill="#ece9e2">Browser</text>
  </g>

  <!-- traditional: direct -->
  <line x1="160" y1="290" x2="160" y2="166" stroke="#8f8d88" stroke-width="2" marker-end="url(#ar)"/>
  <text x="172" y="232" font-size="12" fill="#a19e97">HTML</text>

  <!-- hybrid: html + json -->
  <line x1="410" y1="290" x2="410" y2="166" stroke="#8f8d88" stroke-width="2" marker-end="url(#ar)"/>
  <text x="398" y="232" text-anchor="end" font-size="12" fill="#a19e97">HTML</text>
  <line x1="470" y1="290" x2="470" y2="166" stroke="#f2b880" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="482" y="232" font-size="12" fill="#f2b880">JSON</text>

  <!-- headless: frontend app layer -->
  <line x1="720" y1="196" x2="720" y2="166" stroke="#8f8d88" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="620" y="198" width="200" height="54" rx="10" fill="#2a1c20" stroke="#f28b9b"/>
  <text x="720" y="221" text-anchor="middle" font-size="13" fill="#ece9e2">Next.js / Astro</text>
  <text x="720" y="240" text-anchor="middle" font-size="12" fill="#f28b9b">renders HTML</text>
  <line x1="720" y1="290" x2="720" y2="258" stroke="#f28b9b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="732" y="280" font-size="12" fill="#f28b9b">REST / GraphQL</text>

  <!-- wordpress row -->
  <rect x="60" y="292" width="200" height="64" rx="10" fill="#1b1b20" stroke="#6fd3b0"/>
  <text x="160" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#ece9e2">WordPress</text>
  <text x="160" y="340" text-anchor="middle" font-size="12" fill="#a19e97">theme renders</text>
  <rect x="340" y="292" width="200" height="64" rx="10" fill="#1b1b20" stroke="#f2b880"/>
  <text x="440" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#ece9e2">WordPress</text>
  <text x="440" y="340" text-anchor="middle" font-size="12" fill="#a19e97">theme + REST routes</text>
  <rect x="620" y="292" width="200" height="64" rx="10" fill="#1b1b20" stroke="#f28b9b"/>
  <text x="720" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#ece9e2">WordPress</text>
  <text x="720" y="340" text-anchor="middle" font-size="12" fill="#a19e97">content API only</text>

  <!-- comparison rows -->
  <line x1="40" y1="384" x2="840" y2="384" stroke="#2e2e36"/>
  <g font-size="12" fill="#8f8d88">
    <text x="40" y="414">deploys</text>
    <text x="40" y="446">preview</text>
    <text x="40" y="478">plugins</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="160" y="414" fill="#6fd3b0">1</text>
    <text x="160" y="446" fill="#6fd3b0">built in</text>
    <text x="160" y="478" fill="#6fd3b0">just work</text>
    <text x="440" y="414" fill="#6fd3b0">1</text>
    <text x="440" y="446" fill="#6fd3b0">built in</text>
    <text x="440" y="478" fill="#f2b880">mostly work</text>
    <text x="720" y="414" fill="#f28b9b">2</text>
    <text x="720" y="446" fill="#f28b9b">you build it</text>
    <text x="720" y="478" fill="#f28b9b">API or rebuild</text>
  </g>
</svg>
