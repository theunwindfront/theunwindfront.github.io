<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="470" rx="16" fill="#16161b"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8f8fef"/></marker>
  </defs>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">HOW THE BROWSER PICKS A SRCSET CANDIDATE</text>

  <!-- column headers -->
  <text x="130" y="88" text-anchor="middle" font-size="12" fill="#a19e97">1. evaluate sizes</text>
  <text x="340" y="88" text-anchor="middle" font-size="12" fill="#a19e97">2. display width</text>
  <text x="550" y="88" text-anchor="middle" font-size="12" fill="#a19e97">3. x pixel ratio</text>
  <text x="760" y="88" text-anchor="middle" font-size="12" fill="#a19e97">4. smallest file ≥ need</text>

  <!-- row 1: phone -->
  <text x="40" y="118" font-size="13" fill="#6fd3b0" font-weight="700">PHONE · 390px viewport · DPR 3</text>
  <rect x="40" y="130" width="180" height="70" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="130" y="160" text-anchor="middle" font-size="13" fill="#ece9e2">no media match</text>
  <text x="130" y="182" text-anchor="middle" font-size="13" fill="#b3b3f7">→ 100vw</text>
  <rect x="250" y="130" width="180" height="70" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="340" y="172" text-anchor="middle" font-size="16" fill="#ece9e2" font-weight="700">390 CSS px</text>
  <rect x="460" y="130" width="180" height="70" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="550" y="160" text-anchor="middle" font-size="13" fill="#a19e97">390 × 3 =</text>
  <text x="550" y="182" text-anchor="middle" font-size="15" fill="#f2b880" font-weight="700">1170 px needed</text>
  <rect x="670" y="130" width="180" height="70" rx="10" fill="#15322a" stroke="#6fd3b0"/>
  <text x="760" y="172" text-anchor="middle" font-size="18" fill="#6fd3b0" font-weight="700">1200w</text>
  <line x1="222" y1="165" x2="246" y2="165" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="432" y1="165" x2="456" y2="165" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="642" y1="165" x2="666" y2="165" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>

  <!-- row 2: desktop -->
  <text x="40" y="238" font-size="13" fill="#8f8fef" font-weight="700">DESKTOP · 1440px viewport · DPR 2</text>
  <rect x="40" y="250" width="180" height="70" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="130" y="280" text-anchor="middle" font-size="13" fill="#ece9e2">(min-width:1280px)</text>
  <text x="130" y="302" text-anchor="middle" font-size="13" fill="#b3b3f7">→ 384px</text>
  <rect x="250" y="250" width="180" height="70" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="340" y="292" text-anchor="middle" font-size="16" fill="#ece9e2" font-weight="700">384 CSS px</text>
  <rect x="460" y="250" width="180" height="70" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="550" y="280" text-anchor="middle" font-size="13" fill="#a19e97">384 × 2 =</text>
  <text x="550" y="302" text-anchor="middle" font-size="15" fill="#f2b880" font-weight="700">768 px needed</text>
  <rect x="670" y="250" width="180" height="70" rx="10" fill="#1e1e3a" stroke="#8f8fef"/>
  <text x="760" y="292" text-anchor="middle" font-size="18" fill="#8f8fef" font-weight="700">800w</text>
  <line x1="222" y1="285" x2="246" y2="285" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="432" y1="285" x2="456" y2="285" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="642" y1="285" x2="666" y2="285" stroke="#8f8fef" stroke-width="2" marker-end="url(#ar)"/>

  <!-- candidates -->
  <text x="40" y="364" font-size="12" fill="#8f8d88" letter-spacing="1">srcset candidates (same image, different widths)</text>
  <rect x="40" y="378" width="120" height="40" rx="8" fill="#23232a" stroke="#2e2e36"/>
  <text x="100" y="403" text-anchor="middle" font-size="14" fill="#a19e97">400w</text>
  <rect x="170" y="378" width="200" height="40" rx="8" fill="#1e1e3a" stroke="#8f8fef"/>
  <text x="270" y="403" text-anchor="middle" font-size="14" fill="#8f8fef" font-weight="700">800w · desktop</text>
  <rect x="380" y="378" width="230" height="40" rx="8" fill="#15322a" stroke="#6fd3b0"/>
  <text x="495" y="403" text-anchor="middle" font-size="14" fill="#6fd3b0" font-weight="700">1200w · phone</text>
  <rect x="620" y="378" width="230" height="40" rx="8" fill="#23232a" stroke="#2e2e36"/>
  <text x="735" y="403" text-anchor="middle" font-size="14" fill="#a19e97">1600w</text>
  <text x="40" y="448" font-size="12" fill="#a19e97">The choice happens before layout, so sizes is your promise about the rendered width.</text>
</svg>
