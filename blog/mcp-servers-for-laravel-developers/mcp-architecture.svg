<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="470" rx="16" fill="#16161b"/>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">HOW AN AGENT GETS APP CONTEXT OVER MCP</text>
  <!-- host -->
  <rect x="40" y="80" width="220" height="330" rx="14" fill="#1b1b20" stroke="#5b5bd6" stroke-width="1.5"/>
  <text x="150" y="110" text-anchor="middle" font-size="15" fill="#b3b3f7" font-weight="700">Host</text>
  <text x="150" y="130" text-anchor="middle" font-size="12" fill="#a19e97">Claude Code, Cursor, IDE</text>
  <rect x="62" y="150" width="176" height="70" rx="10" fill="#23232a"/>
  <text x="150" y="180" text-anchor="middle" font-size="14" fill="#ece9e2" font-weight="700">Model</text>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="#a19e97">decides to call a tool</text>
  <path d="M150 220 V 250" stroke="#8f8fef" stroke-width="2"/>
  <rect x="62" y="250" width="176" height="70" rx="10" fill="#23232a"/>
  <text x="150" y="280" text-anchor="middle" font-size="14" fill="#ece9e2" font-weight="700">MCP client</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" fill="#a19e97">one per server</text>
  <text x="150" y="352" text-anchor="middle" font-size="12" fill="#8f8d88">asks approval,</text>
  <text x="150" y="370" text-anchor="middle" font-size="12" fill="#8f8d88">feeds results back</text>
  <!-- transport arrows -->
  <g stroke="#8f8fef" stroke-width="2" fill="none">
    <path d="M238 272 C 290 272, 290 170, 340 170"/>
    <path d="M238 298 C 290 298, 290 330, 340 330"/>
  </g>
  <text x="300" y="380" text-anchor="middle" font-size="12" fill="#b3b3f7">stdio</text>
  <text x="300" y="398" text-anchor="middle" font-size="12" fill="#b3b3f7">JSON-RPC</text>
  <!-- server 1 -->
  <rect x="340" y="100" width="250" height="140" rx="14" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="360" y="130" font-size="14" fill="#ece9e2" font-weight="700">Laravel Boost</text>
  <text x="360" y="150" font-size="12" fill="#a19e97">official, dev-only</text>
  <rect x="360" y="166" width="66" height="26" rx="6" fill="#23232a" stroke="#6fd3b0"/><text x="393" y="184" text-anchor="middle" font-size="12" fill="#6fd3b0">tools</text>
  
  <text x="360" y="220" font-size="12" fill="#8f8d88">routes · schema · logs · docs</text>
  <!-- server 2 -->
  <rect x="340" y="260" width="250" height="140" rx="14" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="360" y="290" font-size="14" fill="#ece9e2" font-weight="700">Your custom server</text>
  <text x="360" y="310" font-size="12" fill="#a19e97">narrow, typed, read-only</text>
  <rect x="360" y="326" width="66" height="26" rx="6" fill="#23232a" stroke="#6fd3b0"/><text x="393" y="344" text-anchor="middle" font-size="12" fill="#6fd3b0">tools</text>
  <rect x="432" y="326" width="80" height="26" rx="6" fill="#23232a" stroke="#f28b9b"/><text x="472" y="344" text-anchor="middle" font-size="12" fill="#f28b9b">prompts</text>
  <text x="360" y="380" font-size="12" fill="#8f8d88">lookup_order · order_history</text>
  <!-- app -->
  <g stroke="#2e2e36" stroke-width="2" fill="none">
    <path d="M590 170 H 640"/><path d="M590 330 H 640"/>
  </g>
  <rect x="640" y="100" width="200" height="300" rx="14" fill="#1b1b20" stroke="#6fd3b0" stroke-width="1.5"/>
  <text x="740" y="130" text-anchor="middle" font-size="15" fill="#6fd3b0" font-weight="700">Laravel app</text>
  <rect x="662" y="150" width="156" height="40" rx="8" fill="#23232a"/><text x="740" y="175" text-anchor="middle" font-size="12" fill="#ece9e2">routes + config</text>
  <rect x="662" y="200" width="156" height="40" rx="8" fill="#23232a"/><text x="740" y="225" text-anchor="middle" font-size="12" fill="#ece9e2">logs</text>
  <rect x="662" y="250" width="156" height="40" rx="8" fill="#23232a"/><text x="740" y="275" text-anchor="middle" font-size="12" fill="#ece9e2">local / staging DB</text>
  <rect x="662" y="310" width="156" height="68" rx="8" fill="#2a2418" stroke="#f2b880"/>
  <text x="740" y="338" text-anchor="middle" font-size="12" fill="#f2b880" font-weight="700">SELECT-only user</text>
  <text x="740" y="358" text-anchor="middle" font-size="12" fill="#a19e97">no prod credentials</text>
  <text x="440" y="446" text-anchor="middle" font-size="13" fill="#ece9e2">Host discovers tools at runtime, calls them, and every call is logged</text>
</svg>
