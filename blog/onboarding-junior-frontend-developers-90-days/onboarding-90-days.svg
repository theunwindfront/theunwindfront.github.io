<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="460" rx="16" fill="#16161b"/>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">90 DAYS, THREE PHASES</text>

  <!-- timeline -->
  <line x1="60" y1="100" x2="820" y2="100" stroke="#2e2e36" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="100" x2="820" y2="100" stroke="#5b5bd6" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 0"/>
  <g font-size="12" text-anchor="middle" fill="#a19e97">
    <circle cx="60" cy="100" r="8" fill="#16161b" stroke="#ece9e2" stroke-width="2"/>
    <text x="60" y="80">day 1</text>
    <circle cx="313" cy="100" r="8" fill="#16161b" stroke="#6fd3b0" stroke-width="2"/>
    <text x="313" y="80">30</text>
    <circle cx="566" cy="100" r="8" fill="#16161b" stroke="#f2b880" stroke-width="2"/>
    <text x="566" y="80">60</text>
    <circle cx="820" cy="100" r="8" fill="#8f8fef"/>
    <text x="820" y="80">90</text>
  </g>

  <!-- week one callout -->
  <rect x="68" y="116" width="120" height="26" rx="13" fill="#23232a" stroke="#8f8fef"/>
  <text x="128" y="134" text-anchor="middle" font-size="12" fill="#b3b3f7">week 1: 1st PR</text>

  <!-- phase cards -->
  <rect x="40" y="160" width="253" height="220" rx="12" fill="#1b1b20" stroke="#6fd3b0"/>
  <text x="60" y="190" font-size="15" font-weight="700" fill="#6fd3b0">Learn the loop</text>
  <g font-size="12" fill="#ece9e2">
    <text x="60" y="222">· ship tiny tickets</text>
    <text x="60" y="246">· markup, CSS, a11y</text>
    <text x="60" y="270">· pair 2-3x / week</text>
    <text x="60" y="294">· read others' PRs</text>
  </g>
  <text x="60" y="340" font-size="12" fill="#8f8d88">support: high</text>
  <rect x="60" y="352" width="210" height="8" rx="4" fill="#2e2e36"/>
  <rect x="60" y="352" width="190" height="8" rx="4" fill="#6fd3b0"/>

  <rect x="313" y="160" width="253" height="220" rx="12" fill="#1b1b20" stroke="#f2b880"/>
  <text x="333" y="190" font-size="15" font-weight="700" fill="#f2b880">Own small features</text>
  <g font-size="12" fill="#ece9e2">
    <text x="333" y="222">· feature with state</text>
    <text x="333" y="246">· write the test</text>
    <text x="333" y="270">· pair 1-2x / week</text>
    <text x="333" y="294">· start reviewing</text>
  </g>
  <text x="333" y="340" font-size="12" fill="#8f8d88">support: medium</text>
  <rect x="333" y="352" width="210" height="8" rx="4" fill="#2e2e36"/>
  <rect x="333" y="352" width="115" height="8" rx="4" fill="#f2b880"/>

  <rect x="586" y="160" width="254" height="220" rx="12" fill="#1b1b20" stroke="#8f8fef"/>
  <text x="606" y="190" font-size="15" font-weight="700" fill="#8f8fef">Work independently</text>
  <g font-size="12" fill="#ece9e2">
    <text x="606" y="222">· pick from the board</text>
    <text x="606" y="246">· split into small PRs</text>
    <text x="606" y="270">· demo to the team</text>
    <text x="606" y="294">· own one area</text>
  </g>
  <text x="606" y="340" font-size="12" fill="#8f8d88">support: regular review</text>
  <rect x="606" y="352" width="210" height="8" rx="4" fill="#2e2e36"/>
  <rect x="606" y="352" width="50" height="8" rx="4" fill="#8f8fef"/>

  <!-- reviews row -->
  <g font-size="12" text-anchor="middle">
    <rect x="253" y="398" width="120" height="30" rx="15" fill="#23232a" stroke="#2e2e36"/>
    <text x="313" y="418" fill="#a19e97">review 30</text>
    <rect x="506" y="398" width="120" height="30" rx="15" fill="#23232a" stroke="#2e2e36"/>
    <text x="566" y="418" fill="#a19e97">review 60</text>
    <rect x="720" y="398" width="120" height="30" rx="15" fill="#23232a" stroke="#8f8fef"/>
    <text x="780" y="418" fill="#b3b3f7">review 90</text>
    <text x="60" y="418" text-anchor="start" fill="#8f8d88">weekly 1:1</text>
  </g>
</svg>
