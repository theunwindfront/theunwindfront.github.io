<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="440" rx="16" fill="#16161b"/>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">THE ASSERTION LADDER</text>
  <!-- axis -->
  <line x1="60" y1="90" x2="60" y2="390" stroke="#2e2e36" stroke-width="2"/>
  <path d="M52 100 l8 -14 l8 14 z" fill="#f28b9b"/>
  <text x="76" y="96" font-size="12" fill="#f28b9b">slower · costlier · subjective</text>
  <text x="76" y="404" font-size="12" fill="#6fd3b0">fast · free · deterministic</text>
  <!-- rungs (bottom up) -->
  <g>
    <rect x="100" y="320" width="740" height="60" rx="10" fill="#1b1b20" stroke="#6fd3b0"/>
    <text x="124" y="346" font-size="15" font-weight="700" fill="#6fd3b0">1. Exact match</text>
    <text x="124" y="366" font-size="12" fill="#a19e97">category, priority, flags, tool names</text>
    <text x="816" y="356" text-anchor="end" font-size="12" fill="#ece9e2">must pass 100%</text>
  </g>
  <g>
    <rect x="100" y="250" width="740" height="60" rx="10" fill="#1b1b20" stroke="#8f8fef"/>
    <text x="124" y="276" font-size="15" font-weight="700" fill="#8f8fef">2. Contains / pattern</text>
    <text x="124" y="296" font-size="12" fill="#a19e97">length limits, required IDs, banned words, no code fence</text>
    <text x="816" y="286" text-anchor="end" font-size="12" fill="#ece9e2">must pass 100%</text>
  </g>
  <g>
    <rect x="100" y="180" width="740" height="60" rx="10" fill="#1b1b20" stroke="#b3b3f7"/>
    <text x="124" y="206" font-size="15" font-weight="700" fill="#b3b3f7">3. Schema valid</text>
    <text x="124" y="226" font-size="12" fill="#a19e97">parses as JSON, right fields and types (Laravel Validator)</text>
    <text x="816" y="216" text-anchor="end" font-size="12" fill="#ece9e2">must pass 100%</text>
  </g>
  <g>
    <rect x="100" y="110" width="740" height="60" rx="10" fill="#1b1b20" stroke="#f2b880"/>
    <text x="124" y="136" font-size="15" font-weight="700" fill="#f2b880">4. LLM-as-judge + rubric</text>
    <text x="124" y="156" font-size="12" fill="#a19e97">tone, relevance, language: binary questions, validated by hand</text>
    <text x="816" y="146" text-anchor="end" font-size="12" fill="#ece9e2">pass-rate threshold</text>
  </g>
</svg>
