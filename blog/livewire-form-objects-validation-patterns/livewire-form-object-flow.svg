<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="440" rx="16" fill="#16161b"/>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">ONE FORM OBJECT, TWO COMPONENTS</text>
  <!-- blade -->
  <rect x="40" y="80" width="230" height="290" rx="14" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="155" y="110" text-anchor="middle" font-size="15" fill="#ece9e2" font-weight="700">Blade view</text>
  <rect x="60" y="128" width="190" height="64" rx="8" fill="#23232a"/>
  <text x="74" y="154" font-size="12" fill="#b3b3f7">wire:model.blur</text>
  <text x="74" y="176" font-size="12" fill="#a19e97">="form.title"</text>
  <rect x="60" y="206" width="190" height="64" rx="8" fill="#23232a"/>
  <text x="74" y="232" font-size="12" fill="#b3b3f7">wire:model</text>
  <text x="74" y="254" font-size="12" fill="#a19e97">="form.body"</text>
  <rect x="60" y="286" width="190" height="62" rx="8" fill="#2a1c20" stroke="#f28b9b"/>
  <text x="74" y="312" font-size="12" fill="#f28b9b">@error('form.title')</text>
  <text x="74" y="336" font-size="12" fill="#a19e97">errors use dot keys</text>
  <!-- arrows -->
  <g stroke="#8f8fef" stroke-width="2" fill="#8f8fef">
    <path d="M270 190 H 322" fill="none"/><path d="M322 184 l8 6 l-8 6 z"/>
    <path d="M330 290 H 278" fill="none"/><path d="M278 284 l-8 6 l8 6 z"/>
  </g>
  <text x="300" y="178" text-anchor="middle" font-size="12" fill="#b3b3f7">sync</text>
  <text x="300" y="312" text-anchor="middle" font-size="12" fill="#f28b9b">errors</text>
  <!-- form object -->
  <rect x="330" y="80" width="250" height="290" rx="14" fill="#1b1b20" stroke="#5b5bd6" stroke-width="1.5"/>
  <text x="455" y="110" text-anchor="middle" font-size="15" fill="#b3b3f7" font-weight="700">PostForm extends Form</text>
  <rect x="350" y="128" width="210" height="62" rx="8" fill="#23232a"/>
  <text x="364" y="152" font-size="13" fill="#f2b880" font-weight="700">fields</text>
  <text x="364" y="174" font-size="12" fill="#a19e97">$post, $title, $slug</text>
  <rect x="350" y="200" width="210" height="62" rx="8" fill="#23232a"/>
  <text x="364" y="224" font-size="13" fill="#8f8fef" font-weight="700">validation</text>
  <text x="364" y="246" font-size="12" fill="#a19e97">#[Validate] + rules()</text>
  <rect x="350" y="272" width="210" height="80" rx="8" fill="#23232a"/>
  <text x="364" y="296" font-size="13" fill="#6fd3b0" font-weight="700">persistence</text>
  <text x="364" y="318" font-size="12" fill="#a19e97">setPost(), store(),</text>
  <text x="364" y="336" font-size="12" fill="#a19e97">update()</text>
  <!-- components -->
  <g stroke="#2e2e36" stroke-width="2" fill="none">
    <path d="M580 225 H 610"/><path d="M610 150 V 300"/><path d="M610 150 H 640"/><path d="M610 300 H 640"/>
  </g>
  <rect x="640" y="100" width="200" height="100" rx="12" fill="#1b1b20" stroke="#6fd3b0"/>
  <text x="740" y="130" text-anchor="middle" font-size="14" fill="#6fd3b0" font-weight="700">CreatePost</text>
  <text x="740" y="156" text-anchor="middle" font-size="12" fill="#a19e97">public PostForm $form</text>
  <text x="740" y="180" text-anchor="middle" font-size="12" fill="#a19e97">save(): store()</text>
  <rect x="640" y="250" width="200" height="100" rx="12" fill="#1b1b20" stroke="#f2b880"/>
  <text x="740" y="280" text-anchor="middle" font-size="14" fill="#f2b880" font-weight="700">EditPost</text>
  <text x="740" y="306" text-anchor="middle" font-size="12" fill="#a19e97">mount: setPost()</text>
  <text x="740" y="330" text-anchor="middle" font-size="12" fill="#a19e97">save(): update()</text>
  <text x="440" y="410" text-anchor="middle" font-size="13" fill="#ece9e2">Components keep authorisation and redirects; the form owns data and rules</text>
</svg>
