<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="440" rx="16" fill="#16161b"/>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">ONE BUNDLE vs A SPLIT BUILD</text>
  <text x="840" y="50" text-anchor="end" font-size="12" fill="#8f8d88">illustrative sizes</text>

  <!-- BEFORE -->
  <text x="40" y="90" font-size="13" fill="#f28b9b" font-weight="700">BEFORE · every page</text>
  <rect x="40" y="104" width="300" height="270" rx="12" fill="#1b1b20" stroke="#f28b9b" stroke-width="1.5"/>
  <text x="60" y="132" font-size="15" fill="#ece9e2" font-weight="700">app.js</text>
  <text x="320" y="132" text-anchor="end" font-size="13" fill="#f28b9b">640 kB</text>
  <rect x="60" y="148" width="260" height="30" rx="6" fill="#23232a"/>
  <text x="74" y="168" font-size="12" fill="#a19e97">your code + alpine</text>
  <rect x="60" y="184" width="260" height="56" rx="6" fill="#2a2330"/>
  <text x="74" y="216" font-size="12" fill="#a19e97">chart library</text>
  <rect x="60" y="246" width="260" height="50" rx="6" fill="#2a2330"/>
  <text x="74" y="275" font-size="12" fill="#a19e97">rich text editor</text>
  <rect x="60" y="302" width="260" height="52" rx="6" fill="#2a2330"/>
  <text x="74" y="332" font-size="12" fill="#a19e97">admin data grid</text>
  <text x="190" y="404" text-anchor="middle" font-size="12" fill="#a19e97">homepage uses ~10% of it</text>

  <!-- arrow -->
  <path d="M362 239 h40" stroke="#8f8fef" stroke-width="2.5" fill="none"/>
  <path d="M402 231 l12 8 l-12 8 z" fill="#8f8fef"/>

  <!-- AFTER -->
  <text x="436" y="90" font-size="13" fill="#6fd3b0" font-weight="700">AFTER · loaded when needed</text>
  <!-- entries -->
  <rect x="436" y="104" width="196" height="54" rx="10" fill="#5b5bd6"/>
  <text x="452" y="128" font-size="14" fill="#fff" font-weight="700">app.js</text>
  <text x="452" y="147" font-size="12" fill="#dedcfb">public · 48 kB</text>
  <rect x="644" y="104" width="196" height="54" rx="10" fill="#5b5bd6"/>
  <text x="660" y="128" font-size="14" fill="#fff" font-weight="700">admin.js</text>
  <text x="660" y="147" font-size="12" fill="#dedcfb">dashboard · 36 kB</text>
  <!-- shared -->
  <path d="M534 158 v20 M742 158 v20 M534 178 h208 M638 178 v14" stroke="#2e2e36" stroke-width="2" fill="none"/>
  <rect x="536" y="192" width="204" height="44" rx="10" fill="#23232a" stroke="#8f8fef"/>
  <text x="638" y="219" text-anchor="middle" font-size="13" fill="#b3b3f7">shared · alpine 44 kB</text>
  <text x="638" y="256" text-anchor="middle" font-size="12" fill="#a19e97">modulepreloaded by @vite</text>
  <!-- lazy -->
  <text x="436" y="292" font-size="12" fill="#f2b880">import() on demand</text>
  <rect x="436" y="304" width="128" height="70" rx="10" fill="none" stroke="#f2b880" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text x="500" y="334" text-anchor="middle" font-size="13" fill="#ece9e2">chart</text>
  <text x="500" y="355" text-anchor="middle" font-size="12" fill="#a19e97">210 kB</text>
  <rect x="574" y="304" width="128" height="70" rx="10" fill="none" stroke="#f2b880" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text x="638" y="334" text-anchor="middle" font-size="13" fill="#ece9e2">editor</text>
  <text x="638" y="355" text-anchor="middle" font-size="12" fill="#a19e97">180 kB</text>
  <rect x="712" y="304" width="128" height="70" rx="10" fill="none" stroke="#f2b880" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text x="776" y="334" text-anchor="middle" font-size="13" fill="#ece9e2">grid</text>
  <text x="776" y="355" text-anchor="middle" font-size="12" fill="#a19e97">150 kB</text>
  <text x="638" y="404" text-anchor="middle" font-size="12" fill="#a19e97">homepage downloads ~92 kB</text>
