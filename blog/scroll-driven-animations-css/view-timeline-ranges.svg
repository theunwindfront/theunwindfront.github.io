<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="470" rx="16" fill="#16161b"/>
  <text x="40" y="44" font-size="15" fill="#8f8d88" letter-spacing="2">VIEW() TIMELINE: ONE ELEMENT'S JOURNEY</text>
  <!-- mini viewports: y 110..230 -->
  <g>
    <!-- 1 cover 0% -->
    <rect x="45" y="110" width="110" height="120" rx="8" fill="#1b1b20" stroke="#8f8d88" stroke-dasharray="5 4"/>
    <rect x="65" y="230" width="70" height="40" rx="6" fill="#6fd3b0"/>
    <!-- 2 entry 100% -->
    <rect x="245" y="110" width="110" height="120" rx="8" fill="#1b1b20" stroke="#8f8d88" stroke-dasharray="5 4"/>
    <rect x="265" y="190" width="70" height="40" rx="6" fill="#8f8fef"/>
    <!-- 3 exit 0% -->
    <rect x="525" y="110" width="110" height="120" rx="8" fill="#1b1b20" stroke="#8f8d88" stroke-dasharray="5 4"/>
    <rect x="545" y="110" width="70" height="40" rx="6" fill="#8f8fef"/>
    <!-- 4 cover 100% -->
    <rect x="725" y="110" width="110" height="120" rx="8" fill="#1b1b20" stroke="#8f8d88" stroke-dasharray="5 4"/>
    <rect x="745" y="70" width="70" height="40" rx="6" fill="#f2b880"/>
  </g>
  <text x="440" y="175" text-anchor="middle" font-size="12" fill="#8f8d88">dashed box = viewport</text>
  <text x="440" y="195" text-anchor="middle" font-size="12" fill="#8f8d88">scrolling down →</text>
  <!-- labels -->
  <g font-size="12" text-anchor="middle">
    <text x="100" y="298" fill="#ece9e2">cover 0%</text><text x="100" y="316" fill="#a19e97">entry 0%</text>
    <text x="300" y="298" fill="#ece9e2">entry 100%</text><text x="300" y="316" fill="#a19e97">contain 0%</text>
    <text x="580" y="298" fill="#ece9e2">contain 100%</text><text x="580" y="316" fill="#a19e97">exit 0%</text>
    <text x="780" y="298" fill="#ece9e2">exit 100%</text><text x="780" y="316" fill="#a19e97">cover 100%</text>
  </g>
  <!-- ticks -->
  <g stroke="#2e2e36" stroke-width="2">
    <line x1="100" y1="326" x2="100" y2="346"/><line x1="300" y1="326" x2="300" y2="346"/>
    <line x1="580" y1="326" x2="580" y2="346"/><line x1="780" y1="326" x2="780" y2="346"/>
  </g>
  <!-- range bar -->
  <rect x="100" y="348" width="198" height="36" rx="8" fill="#6fd3b0"/>
  <text x="199" y="371" text-anchor="middle" font-size="13" fill="#10281f" font-weight="700">entry</text>
  <rect x="302" y="348" width="276" height="36" rx="8" fill="#8f8fef"/>
  <text x="440" y="371" text-anchor="middle" font-size="13" fill="#15153a" font-weight="700">contain</text>
  <rect x="582" y="348" width="198" height="36" rx="8" fill="#f2b880"/>
  <text x="681" y="371" text-anchor="middle" font-size="13" fill="#3a2a10" font-weight="700">exit</text>
  <path d="M100 396 v10 h680 v-10" fill="none" stroke="#ece9e2" stroke-width="2"/>
  <text x="440" y="428" text-anchor="middle" font-size="13" fill="#ece9e2" font-weight="700">cover = the whole journey</text>
  <text x="440" y="450" text-anchor="middle" font-size="12" fill="#8f8d88">(element shorter than the viewport)</text>
</svg>
