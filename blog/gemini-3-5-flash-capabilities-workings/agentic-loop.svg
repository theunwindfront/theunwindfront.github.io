<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sky-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" rx="12" fill="#09090b" stroke="#1e1e24" stroke-width="1"/>

  <!-- GRID -->
  <path d="M 0,30 L 600,30 M 0,60 L 600,60 M 0,90 L 600,90 M 0,120 L 600,120 M 0,150 L 600,150 M 0,180 L 600,180 M 0,210 L 600,210 M 0,240 L 600,240 M 0,270 L 600,270 M 50,0 L 50,300 M 100,0 L 100,300 M 150,0 L 150,300 M 200,0 L 200,300 M 250,0 L 250,300 M 300,0 L 300,300 M 350,0 L 350,300 M 400,0 L 400,300 M 450,0 L 450,300 M 500,0 L 500,300 M 550,0 L 550,300" fill="none" stroke="#27272a" stroke-width="0.5" opacity="0.3"/>

  <!-- Loop Nodes -->

  <!-- 1. User Request (External Trigger) -->
  <g transform="translate(30, 115)" filter="url(#shadow)">
    <rect width="90" height="70" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="45" y="32" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">User Request</text>
    <text x="45" y="48" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">"Create Blog"</text>
  </g>
  <path d="M 120,150 L 160,150" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- 2. Thought (Gemini LLM Reasoning) -->
  <g transform="translate(160, 105)" filter="url(#shadow)">
    <rect width="110" height="90" rx="12" fill="url(#purple-glow)"/>
    <circle cx="55" cy="30" r="16" fill="rgba(255,255,255,0.2)"/>
    <!-- Sparkle/Lightbulb Icon -->
    <path d="M 55,20 L 57,26 L 63,28 L 57,30 L 55,36 L 53,30 L 47,28 L 53,26 Z" fill="#fff"/>
    <text x="55" y="65" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="extrabold" text-anchor="middle">1. Thought</text>
    <text x="55" y="78" fill="rgba(255,255,255,0.8)" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Reasoning & Plan</text>
  </g>

  <!-- Connection to Tool Call -->
  <path d="M 270,150 L 320,150" stroke="#a855f7" stroke-width="2" fill="none"/>

  <!-- 3. Action / Tool Call -->
  <g transform="translate(320, 105)" filter="url(#shadow)">
    <rect width="110" height="90" rx="12" fill="url(#sky-glow)"/>
    <circle cx="55" cy="30" r="16" fill="rgba(255,255,255,0.2)"/>
    <!-- Terminal Icon -->
    <path d="M 47,26 L 52,30 L 47,34 M 54,34 L 62,34" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="55" y="65" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="extrabold" text-anchor="middle">2. Action</text>
    <text x="55" y="78" fill="rgba(255,255,255,0.8)" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Tool: write_file</text>
  </g>

  <!-- Connection to Observation -->
  <path d="M 430,150 Q 480,150 480,210" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- 4. Observation (Execution Sandbox / Workspace) -->
  <g transform="translate(425, 210)" filter="url(#shadow)">
    <rect width="110" height="70" rx="10" fill="url(#emerald-glow)"/>
    <text x="55" y="32" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="extrabold" text-anchor="middle">3. Observation</text>
    <text x="55" y="48" fill="rgba(255,255,255,0.9)" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Result: Success</text>
    <text x="55" y="58" fill="rgba(255,255,255,0.7)" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">File written. 200 OK</text>
  </g>

  <!-- Feedback loop back to Thought -->
  <path d="M 425,245 L 215,245 Q 215,245 215,195" stroke="#34d399" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- Marker Arrow Definition -->
  <svg>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#71717a"/>
      </marker>
    </defs>
  </svg>
</svg>
