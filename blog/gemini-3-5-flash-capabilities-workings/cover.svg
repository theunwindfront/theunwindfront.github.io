<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>

    <!-- Gemini Magic Gradients -->
    <linearGradient id="gemini-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-glow)"/>

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="150" r="180" fill="#4f46e5" opacity="0.15" filter="url(#soft-glow)"/>
  <circle cx="600" cy="300" r="150" fill="#a855f7" opacity="0.12" filter="url(#soft-glow)"/>
  <circle cx="400" cy="225" r="100" fill="#0ea5e9" opacity="0.1" filter="url(#soft-glow)"/>

  <!-- Grid Overlay -->
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 50,0 L 50,450 M 100,0 L 100,450 M 150,0 L 150,450 M 200,0 L 200,450 M 250,0 L 250,450 M 300,0 L 300,450 M 350,0 L 350,450 M 400,0 L 400,450 M 450,0 L 450,450 M 500,0 L 500,450 M 550,0 L 550,450 M 600,0 L 600,450 M 650,0 L 650,450 M 700,0 L 700,450 M 750,0 L 750,450" fill="none" stroke="url(#grid-grad)" stroke-width="1"/>

  <!-- Futuristic HUD / Rings -->
  <g transform="translate(400, 225)" stroke="url(#gemini-primary)" fill="none" opacity="0.8">
    <!-- Outer Orbiting Ring -->
    <circle r="160" stroke-width="1" stroke-dasharray="8 12" opacity="0.3"/>
    <!-- Middle Ring -->
    <circle r="120" stroke-width="1.5" stroke-dasharray="200 40 40 40" opacity="0.6"/>
    <!-- Inner Solid Ring -->
    <circle r="80" stroke-width="0.75" opacity="0.4"/>
    <!-- Tech ticks -->
    <path d="M -85,0 L -75,0 M 85,0 L 75,0 M 0,-85 L 0,-75 M 0,85 L 0,75" stroke-width="2"/>
    <path d="M -125,0 L -115,0 M 125,0 L 115,0 M 0,-125 L 0,-115 M 0,125 L 0,115" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Network / Particle Nodes -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.4">
    <line x1="280" y1="120" x2="350" y2="160"/>
    <line x1="350" y1="160" x2="320" y2="250"/>
    <line x1="320" y1="250" x2="260" y2="280"/>
    <line x1="260" y1="280" x2="280" y2="120"/>
    <line x1="520" y1="120" x2="450" y2="160"/>
    <line x1="450" y1="160" x2="480" y2="250"/>
    <line x1="480" y1="250" x2="540" y2="280"/>
    <line x1="540" y1="280" x2="520" y2="120"/>
    <line x1="320" y1="250" x2="480" y2="250"/>
    <line x1="350" y1="160" x2="450" y2="160"/>
  </g>

  <g fill="#38bdf8" opacity="0.8">
    <circle cx="280" cy="120" r="3" fill="#6366f1"/>
    <circle cx="350" cy="160" r="4" fill="#38bdf8"/>
    <circle cx="320" cy="250" r="3" fill="#a855f7"/>
    <circle cx="260" cy="280" r="5" fill="#38bdf8"/>
    <circle cx="520" cy="120" r="3" fill="#a855f7"/>
    <circle cx="450" cy="160" r="4" fill="#38bdf8"/>
    <circle cx="480" cy="250" r="3" fill="#6366f1"/>
    <circle cx="540" cy="280" r="5" fill="#38bdf8"/>
  </g>

  <!-- Glowing Gemini Sparkle Stars (Google Gemini Brand Symbol) -->
  <!-- Main Star -->
  <g transform="translate(400, 225)" filter="url(#glow)">
    <path d="M 0,-45 C 1,-15 15,-1 45,0 C 15,1 1,15 0,45 C -1,15 -15,1 -45,0 C -15,-1 -1,-15 0,-45 Z" fill="url(#gemini-primary)"/>
  </g>
  <!-- Supporting Star 1 -->
  <g transform="translate(490, 140)" filter="url(#glow)">
    <path d="M 0,-20 C 0.5,-7 7,-0.5 20,0 C 7,0.5 0.5,7 0,20 C -0.5,7 -7,0.5 -20,0 C -7,-0.5 -0.5,-7 0,-20 Z" fill="#38bdf8" opacity="0.9"/>
  </g>
  <!-- Supporting Star 2 -->
  <g transform="translate(300, 290)" filter="url(#glow)">
    <path d="M 0,-15 C 0.4,-5 5,-0.4 15,0 C 5,0.4 0.4,5 0,15 C -0.4,5 -5,0.4 -15,0 C -5,-0.4 -0.4,-5 0,-15 Z" fill="#a855f7" opacity="0.8"/>
  </g>

  <!-- Decorative HUD Text Elements -->
  <text x="50" y="415" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6366f1" opacity="0.6" letter-spacing="2">SYS_ACTIVE: GEMINI_3.5_FLASH</text>
  <text x="750" y="415" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" opacity="0.6" letter-spacing="2" text-anchor="end">CTX_LEN: 1,000,000</text>
</svg>
