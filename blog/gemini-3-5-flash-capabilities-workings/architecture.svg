<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <!-- Colors -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="model-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" rx="12" fill="#09090b" stroke="#1e1e24" stroke-width="1"/>

  <!-- GRID -->
  <path d="M 0,30 L 600,30 M 0,60 L 600,60 M 0,90 L 600,90 M 0,120 L 600,120 M 0,150 L 600,150 M 0,180 L 600,180 M 0,210 L 600,210 M 0,240 L 600,240 M 0,270 L 600,270 M 50,0 L 50,300 M 100,0 L 100,300 M 150,0 L 150,300 M 200,0 L 200,300 M 250,0 L 250,300 M 300,0 L 300,300 M 350,0 L 350,300 M 400,0 L 400,300 M 450,0 L 450,300 M 500,0 L 500,300 M 550,0 L 550,300" fill="none" stroke="#27272a" stroke-width="0.5" opacity="0.3"/>

  <!-- Left: Modalities (Inputs) -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Video Box -->
    <rect x="0" y="20" width="110" height="45" rx="8" fill="url(#blue-grad)"/>
    <text x="55" y="47" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🎬 Video Frames</text>
    
    <!-- Audio Box -->
    <rect x="0" y="95" width="110" height="45" rx="8" fill="url(#purple-grad)"/>
    <text x="55" y="122" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🔊 Audio Waves</text>

    <!-- Text Box -->
    <rect x="0" y="170" width="110" height="45" rx="8" fill="url(#indigo-grad)"/>
    <text x="55" y="197" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📄 Text Tokens</text>
  </g>

  <!-- Connective Lines (Inputs to Shared Embeddings) -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 150,72 L 230,127"/>
    <path d="M 150,147 L 230,147"/>
    <path d="M 150,222 L 230,167"/>
  </g>

  <!-- Middle: Shared Multimodal Embeddings Layer -->
  <g transform="translate(230, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="75" rx="10" fill="url(#model-grad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="65" y="32" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Shared Joint</text>
    <text x="65" y="48" fill="#a855f7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Representation</text>
    <text x="65" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">(Early Fusion)</text>
  </g>

  <!-- Connective Line (Embedding to Transformer Core) -->
  <path d="M 360,147 L 400,147" stroke="#a855f7" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- Right: Transformer Core -->
  <g transform="translate(400, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="145" rx="12" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="30" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="extrabold" text-anchor="middle">Gemini Core</text>
    <text x="80" y="48" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Transformer Decoders</text>
    
    <!-- Inner blocks inside core -->
    <rect x="15" y="65" width="130" height="25" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <text x="80" y="81" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Linear Attention</text>

    <rect x="15" y="98" width="130" height="30" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <text x="80" y="112" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">MoE Routing (1M Context)</text>
  </g>

  <!-- Labels -->
  <text x="95" y="270" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Unified Input</text>
  <text x="295" y="270" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Early Fusion Layer</text>
  <text x="480" y="270" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Decoder-Only Transformer</text>
</svg>
