<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="420" rx="16" fill="#16161b"/>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">ONE INTERFACE, CONFIG PICKS THE MODEL</text>
  <!-- feature code -->
  <rect x="40" y="90" width="190" height="200" rx="14" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="58" y="120" font-size="14" fill="#ece9e2" font-weight="700">Feature code</text>
  <g font-size="12" fill="#a19e97">
    <rect x="58" y="136" width="154" height="30" rx="7" fill="#23232a"/><text x="70" y="156">Controllers</text>
    <rect x="58" y="174" width="154" height="30" rx="7" fill="#23232a"/><text x="70" y="194">Queued jobs</text>
    <rect x="58" y="212" width="154" height="30" rx="7" fill="#23232a"/><text x="70" y="232">Livewire</text>
    <rect x="58" y="250" width="154" height="30" rx="7" fill="#23232a"/><text x="70" y="270">Seeders</text>
  </g>
  <!-- interface -->
  <rect x="280" y="130" width="200" height="120" rx="14" fill="#1b1b20" stroke="#8f8fef" stroke-width="2"/>
  <text x="380" y="164" text-anchor="middle" font-size="14" fill="#b3b3f7" font-weight="700">LlmClient</text>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#a19e97">chat(messages)</text>
  <text x="380" y="210" text-anchor="middle" font-size="12" fill="#a19e97">embed(texts)</text>
  <text x="380" y="232" text-anchor="middle" font-size="12" fill="#8f8d88">/v1 format</text>
  <g stroke="#8f8fef" stroke-width="2" fill="none">
    <path d="M232 190 h42"/><path d="M267 184 l8 6 l-8 6"/>
  </g>
  <!-- config switch -->
  <rect x="280" y="298" width="200" height="72" rx="12" fill="#23232a" stroke="#2e2e36"/>
  <text x="380" y="326" text-anchor="middle" font-size="12" fill="#ece9e2">config/ai.php</text>
  <text x="380" y="350" text-anchor="middle" font-size="12" fill="#f2b880">AI_PROVIDER=…</text>
  <path d="M380 296 v-44" stroke="#f2b880" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- providers -->
  <rect x="560" y="90" width="280" height="110" rx="14" fill="#12261f" stroke="#6fd3b0"/>
  <text x="580" y="120" font-size="14" fill="#6fd3b0" font-weight="700">ollama (local)</text>
  <text x="580" y="144" font-size="12" fill="#a19e97">localhost:11434/v1</text>
  <text x="580" y="164" font-size="12" fill="#a19e97">free · offline · private</text>
  <text x="580" y="184" font-size="12" fill="#8f8d88">.env on your laptop</text>
  <rect x="560" y="230" width="280" height="110" rx="14" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="580" y="260" font-size="14" fill="#ece9e2" font-weight="700">hosted provider</text>
  <text x="580" y="284" font-size="12" fill="#a19e97">https://…/v1 + API key</text>
  <text x="580" y="304" font-size="12" fill="#a19e97">stronger models, paid</text>
  <text x="580" y="324" font-size="12" fill="#8f8d88">.env on staging / prod</text>
  <g fill="none" stroke-width="2">
    <path d="M482 175 C 520 175, 520 145, 554 145" stroke="#6fd3b0"/>
    <path d="M546 139 l8 6 l-8 6" stroke="#6fd3b0"/>
    <path d="M482 205 C 520 205, 520 285, 554 285" stroke="#8f8d88" stroke-dasharray="5 5"/>
    <path d="M546 279 l8 6 l-8 6" stroke="#8f8d88"/>
  </g>
  <text x="560" y="384" font-size="12" fill="#f28b9b">embeddings from different models</text>
  <text x="560" y="402" font-size="12" fill="#f28b9b">are not comparable: re-embed</text>
</svg>
