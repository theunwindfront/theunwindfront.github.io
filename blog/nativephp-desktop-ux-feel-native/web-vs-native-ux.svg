<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="470" rx="16" fill="#16161b"/>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">WEBSITE IN A BOX  VS  FEELS NATIVE</text>
  <!-- headers -->
  <rect x="40" y="74" width="380" height="40" rx="10" fill="#2a1c20" stroke="#f28b9b"/>
  <text x="230" y="99" text-anchor="middle" font-size="14" fill="#f28b9b" font-weight="700">Web-ism</text>
  <rect x="460" y="74" width="380" height="40" rx="10" fill="#1a2a24" stroke="#6fd3b0"/>
  <text x="650" y="99" text-anchor="middle" font-size="14" fill="#6fd3b0" font-weight="700">Native behaviour</text>
  <g font-size="13">
    <!-- row 1 -->
    <rect x="40" y="128" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="60" y="158" fill="#ece9e2">Sidebar labels highlight on drag</text>
    <rect x="460" y="128" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="480" y="158" fill="#ece9e2">UI chrome is not selectable</text>
    <!-- row 2 -->
    <rect x="40" y="188" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="60" y="218" fill="#ece9e2">Hand cursor on every button</text>
    <rect x="460" y="188" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="480" y="218" fill="#ece9e2">Default arrow cursor</text>
    <!-- row 3 -->
    <rect x="40" y="248" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="60" y="278" fill="#ece9e2">Default menu, no shortcuts</text>
    <rect x="460" y="248" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="480" y="278" fill="#ece9e2">Full app menu, CmdOrCtrl keys</text>
    <!-- row 4 -->
    <rect x="40" y="308" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="60" y="338" fill="#ece9e2">In-page toasts only</text>
    <rect x="460" y="308" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="480" y="338" fill="#ece9e2">OS notifications for background</text>
    <!-- row 5 -->
    <rect x="40" y="368" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="60" y="398" fill="#ece9e2">White flash, then a spinner</text>
    <rect x="460" y="368" width="380" height="50" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
    <text x="480" y="398" fill="#ece9e2">Themed window, skeleton first</text>
  </g>
  <!-- arrows -->
  <g stroke="#8f8fef" stroke-width="2" fill="#8f8fef">
    <path d="M424 153 H 450" /><path d="M450 148 l6 5 l-6 5 z"/>
    <path d="M424 213 H 450" /><path d="M450 208 l6 5 l-6 5 z"/>
    <path d="M424 273 H 450" /><path d="M450 268 l6 5 l-6 5 z"/>
    <path d="M424 333 H 450" /><path d="M450 328 l6 5 l-6 5 z"/>
    <path d="M424 393 H 450" /><path d="M450 388 l6 5 l-6 5 z"/>
  </g>
  <text x="440" y="448" text-anchor="middle" font-size="13" fill="#a19e97">Each fix is small: a few lines of CSS or a menu entry, not a redesign</text>
</svg>
