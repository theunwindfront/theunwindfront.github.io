<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" xml:space="preserve" font-family="ui-monospace, Menlo, monospace">
  <rect width="880" height="470" rx="16" fill="#16161b"/>
  <text x="40" y="50" font-size="15" fill="#8f8d88" letter-spacing="2">CLAMP(1REM, 0.9022REM + 0.4348VW, 1.25REM)</text>
  <!-- axes -->
  <line x1="110" y1="90" x2="110" y2="370" stroke="#2e2e36" stroke-width="2"/>
  <line x1="110" y1="370" x2="840" y2="370" stroke="#2e2e36" stroke-width="2"/>
  <text x="96" y="140" font-size="12" fill="#a19e97" text-anchor="end">20px</text>
  <text x="96" y="304" font-size="12" fill="#a19e97" text-anchor="end">16px</text>
  <text x="60" y="226" font-size="12" fill="#8f8d88" text-anchor="middle" transform="rotate(-90 60 226)">font-size</text>
  <line x1="110" y1="136" x2="840" y2="136" stroke="#2e2e36" stroke-dasharray="3 5"/>
  <line x1="110" y1="300" x2="840" y2="300" stroke="#2e2e36" stroke-dasharray="3 5"/>
  <text x="250" y="392" font-size="12" fill="#a19e97" text-anchor="middle">360px</text>
  <text x="690" y="392" font-size="12" fill="#a19e97" text-anchor="middle">1280px</text>
  <text x="475" y="420" font-size="12" fill="#8f8d88" text-anchor="middle">viewport width</text>
  <line x1="250" y1="300" x2="250" y2="370" stroke="#2e2e36" stroke-dasharray="3 5"/>
  <line x1="690" y1="136" x2="690" y2="370" stroke="#2e2e36" stroke-dasharray="3 5"/>
  <!-- zones -->
  <rect x="112" y="92" width="136" height="276" fill="#f28b9b" opacity=".06"/>
  <rect x="692" y="92" width="146" height="276" fill="#6fd3b0" opacity=".06"/>
  <!-- line -->
  <polyline points="110,300 250,300 690,136 840,136" fill="none" stroke="#8f8fef" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="250" cy="300" r="7" fill="#f28b9b"/>
  <circle cx="690" cy="136" r="7" fill="#6fd3b0"/>
  <!-- labels -->
  <text x="180" y="284" font-size="13" fill="#f28b9b" text-anchor="middle" font-weight="700">MIN</text>
  <text x="180" y="330" font-size="12" fill="#a19e97" text-anchor="middle">1rem</text>
  <text x="765" y="120" font-size="13" fill="#6fd3b0" text-anchor="middle" font-weight="700">MAX</text>
  <text x="765" y="160" font-size="12" fill="#a19e97" text-anchor="middle">1.25rem</text>
  <!-- slope annotation -->
  <rect x="140" y="150" width="250" height="62" rx="10" fill="#1b1b20" stroke="#5b5bd6"/>
  <text x="265" y="174" font-size="13" fill="#b3b3f7" text-anchor="middle" font-weight="700">PREFERRED</text>
  <text x="265" y="196" font-size="12" fill="#ece9e2" text-anchor="middle">0.9022rem + 0.4348vw</text>
  <rect x="470" y="262" width="340" height="80" rx="10" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="486" y="286" font-size="12" fill="#f2b880">slope = (20 - 16) / (1280 - 360)</text>
  <text x="486" y="306" font-size="12" fill="#f2b880">         = 0.004348 → 0.4348vw</text>
  <text x="486" y="328" font-size="12" fill="#f2b880">intercept = 16 - slope × 360 = 14.43px</text>
  <text x="440" y="452" font-size="13" fill="#ece9e2" text-anchor="middle">flat below 360px · linear in between · flat above 1280px</text>
</svg>
