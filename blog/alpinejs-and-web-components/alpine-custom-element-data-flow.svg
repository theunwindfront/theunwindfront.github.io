<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="ui-monospace, Menlo, monospace">
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f2b880"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8f8fef"/></marker>
    <marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6fd3b0"/></marker>
  </defs>
  <rect width="880" height="470" rx="16" fill="#16161b"/>
  <text x="40" y="48" font-size="15" fill="#8f8d88" letter-spacing="2">HOW ALPINE AND A CUSTOM ELEMENT TALK</text>

  <!-- Alpine side -->
  <rect x="40" y="80" width="250" height="270" rx="14" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="60" y="110" font-size="15" fill="#ece9e2" font-weight="700">Alpine component</text>
  <text x="60" y="134" font-size="12" fill="#8f8d88">x-data="{ … }"</text>
  <rect x="60" y="156" width="210" height="34" rx="8" fill="#23232a"/>
  <text x="74" y="178" font-size="12" fill="#f2b880">token: 'sk_live…'</text>
  <rect x="60" y="200" width="210" height="34" rx="8" fill="#23232a"/>
  <text x="74" y="222" font-size="12" fill="#b3b3f7">points: [12, 18, 9]</text>
  <rect x="60" y="280" width="210" height="46" rx="8" fill="#152620" stroke="#6fd3b0"/>
  <text x="74" y="300" font-size="12" fill="#6fd3b0">@copy-success=</text>
  <text x="74" y="317" font-size="12" fill="#6fd3b0">"toast = '…'"</text>

  <!-- arrows -->
  <line x1="290" y1="173" x2="556" y2="173" stroke="#f2b880" stroke-width="2.5" marker-end="url(#am)"/>
  <text x="423" y="160" text-anchor="middle" font-size="13" fill="#f2b880" font-weight="700">attributes</text>
  <text x="423" y="193" text-anchor="middle" font-size="12" fill="#a19e97">:value="token" · strings only</text>

  <line x1="290" y1="232" x2="556" y2="232" stroke="#8f8fef" stroke-width="2.5" marker-end="url(#ac)"/>
  <text x="423" y="220" text-anchor="middle" font-size="13" fill="#b3b3f7" font-weight="700">properties</text>
  <text x="423" y="252" text-anchor="middle" font-size="12" fill="#a19e97">x-effect="$el.points = points"</text>

  <line x1="556" y1="303" x2="294" y2="303" stroke="#6fd3b0" stroke-width="2.5" marker-end="url(#mi)"/>
  <text x="423" y="291" text-anchor="middle" font-size="13" fill="#6fd3b0" font-weight="700">events</text>
  <text x="423" y="323" text-anchor="middle" font-size="12" fill="#a19e97">CustomEvent · bubbles, composed</text>

  <!-- custom element -->
  <rect x="560" y="80" width="280" height="270" rx="14" fill="#1f1f33" stroke="#5b5bd6" stroke-width="2"/>
  <text x="580" y="110" font-size="15" fill="#ece9e2" font-weight="700">&lt;copy-button&gt;</text>
  <text x="580" y="134" font-size="12" fill="#8f8d88">class extends HTMLElement</text>
  <rect x="580" y="156" width="240" height="78" rx="10" fill="#23232a" stroke="#2e2e36"/>
  <text x="596" y="180" font-size="12" fill="#ece9e2" font-weight="700">light DOM</text>
  <text x="596" y="202" font-size="12" fill="#a19e97">&lt;button&gt; · Tailwind ✓</text>
  <text x="596" y="222" font-size="12" fill="#a19e97">Alpine can init here ✓</text>
  <rect x="580" y="248" width="240" height="84" rx="10" fill="none" stroke="#f28b9b" stroke-dasharray="6 5"/>
  <text x="596" y="272" font-size="12" fill="#f28b9b" font-weight="700">shadow root (optional)</text>
  <text x="596" y="294" font-size="12" fill="#a19e97">page CSS blocked</text>
  <text x="596" y="314" font-size="12" fill="#a19e97">no Alpine inside</text>

  <!-- bottom notes -->
  <rect x="40" y="378" width="800" height="62" rx="12" fill="#1b1b20" stroke="#2e2e36"/>
  <text x="60" y="404" font-size="12" fill="#a19e97">Crosses the shadow boundary:</text>
  <text x="60" y="425" font-size="13" fill="#ece9e2">inherited props · <tspan fill="#b3b3f7">var(--tokens)</tspan> · <tspan fill="#f2b880">::part()</tspan> · slotted content</text>
</svg>
